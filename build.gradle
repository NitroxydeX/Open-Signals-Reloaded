plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.8.10'
}
group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

sourceSets {
    main {
        java {
            srcDirs(
                "guilib/src/",
                "linkableapi/src/",
                "contentPackLib/src"
            )
        }
    }
}

neoForge {
    version = project.neo_version
    accessTransformers = files()
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories { mavenCentral() }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources.exclude('META-INF/accesstransformer.cfg')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title": project.mod_name,
            "Specification-Vendor": "troblecodings",
            "Specification-Version": project.version,
            "Implementation-Title": project.mod_name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}



def key = System.getenv("CURSETOKEN")
if (key == null)
    key = 'dev'

curseforge {
    apiKey = key 

    project {
        id = project.curseforge_project_id

        changelog = file("changelog.md")
        changelogType = "markdown"

        releaseType = "release"

        addGameVersion project.minecraft_version
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = project.modrinth_project_id

    versionNumber = project.version
    versionName = "${project.mod_name} ${project.version}"

    uploadFile = jar

    gameVersions = [project.minecraft_version]
    loaders = [project.loader]

    changelog = file("changelog.md").text
}

tasks.register("publishMods") {
    dependsOn("curseforge", "modrinth")
}